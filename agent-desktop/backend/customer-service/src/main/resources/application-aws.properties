server.port=8081
spring.application.name=customer-service

# AWS RDS PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/agentdb
spring.datasource.username=${DB_USERNAME:agent}
spring.datasource.password=${DB_PASSWORD:agent123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.agent.desktop.customer=INFO
